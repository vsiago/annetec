<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <!-- Checkered diagonal pattern (pink/rose) -->
  <g fill="#C4737B" transform="translate(35, 4)">
    <rect x="22" y="0" width="7" height="7" rx="1" opacity="0.5" />
    <rect x="31" y="0" width="7" height="7" rx="1" opacity="0.4" />
    <rect x="27" y="8" width="7" height="7" rx="1" opacity="0.6" />

    <rect x="14" y="10" width="9" height="9" rx="1" opacity="0.7" />
    <rect x="24" y="10" width="9" height="9" rx="1" opacity="0.9" />

    <rect x="4" y="20" width="10" height="10" rx="1" opacity="0.8" />
    <rect x="15" y="20" width="10" height="10" rx="1" opacity="0.95" />
    <rect x="26" y="20" width="10" height="10" rx="1" opacity="0.75" />

    <rect x="-6" y="32" width="11" height="11" rx="1" opacity="0.8" />
    <rect x="6" y="32" width="11" height="11" rx="1" fill="#C4737B" />

    <rect x="-16" y="44" width="10" height="10" rx="1" opacity="0.6" />
    <rect x="-5" y="44" width="10" height="10" rx="1" opacity="0.8" />
  </g>

  <!-- "mepcard" text -->
  <text x="85" y="42" font-family="'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="700" font-size="34" fill="#C4737B" letter-spacing="1">
    mepcard
  </text>

  <!-- "MELHOR PARA SAÚDE" tagline -->
  <text x="86" y="58" font-family="'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="600" font-size="9" fill="#C4737B" letter-spacing="3">
    MELHOR PARA SAÚDE
  </text>
</svg>
