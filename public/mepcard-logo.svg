<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="mepRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4838C" />
      <stop offset="100%" stop-color="#B5677A" />
    </linearGradient>
  </defs>

  <!-- Checkered diagonal pattern (pixel/racing flag style) -->
  <g fill="#C4737B" transform="translate(140, 10)">
    <!-- Top row (smallest squares, scattered) -->
    <rect x="80" y="0" width="14" height="14" rx="1" opacity="0.5" />
    <rect x="98" y="0" width="14" height="14" rx="1" opacity="0.4" />
    <rect x="90" y="16" width="14" height="14" rx="1" opacity="0.6" />

    <!-- Second row -->
    <rect x="62" y="20" width="16" height="16" rx="1" opacity="0.65" />
    <rect x="80" y="20" width="16" height="16" rx="1" opacity="0.85" />

    <!-- Third row -->
    <rect x="44" y="40" width="18" height="18" rx="2" />
    <rect x="64" y="40" width="18" height="18" rx="2" opacity="0.9" />
    <rect x="84" y="40" width="18" height="18" rx="2" opacity="0.7" />

    <!-- Fourth row -->
    <rect x="26" y="62" width="20" height="20" rx="2" />
    <rect x="48" y="62" width="20" height="20" rx="2" opacity="0.85" />

    <!-- Fifth row -->
    <rect x="6" y="86" width="22" height="22" rx="2" />
    <rect x="30" y="86" width="22" height="22" rx="2" opacity="0.9" />

    <!-- Sixth row -->
    <rect x="-14" y="112" width="22" height="22" rx="2" opacity="0.8" />
    <rect x="10" y="112" width="22" height="22" rx="2" />

    <!-- Seventh row (bottom) -->
    <rect x="-34" y="138" width="20" height="20" rx="2" opacity="0.6" />
    <rect x="-12" y="138" width="20" height="20" rx="2" opacity="0.75" />
  </g>

  <!-- "mepcard" text -->
  <text x="200" y="228" font-family="'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="700" font-size="56" fill="#C4737B" text-anchor="middle" letter-spacing="2">
    mepcard
  </text>

  <!-- "MELHOR PARA SAÚDE" tagline -->
  <text x="200" y="262" font-family="'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="500" font-size="16" fill="#C4737B" text-anchor="middle" letter-spacing="5">
    MELHOR PARA SAÚDE
  </text>
</svg>
